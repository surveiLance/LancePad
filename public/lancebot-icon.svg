<svg viewBox="0 0 52 54" fill="none" xmlns="http://www.w3.org/2000/svg" width="52" height="54">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <radialGradient id="cupOuter" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#E0D3C0"/>
      <stop offset="100%" stop-color="#BCA898"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Headset band shadow -->
  <path d="M 10 24 Q 26 3 42 24" stroke="#8A7A66" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.25" transform="translate(0,2)"/>
  <!-- Headset main band -->
  <path d="M 10 24 Q 26 3 42 24" stroke="#C8B89C" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Top highlight -->
  <path d="M 11 24 Q 26 5 41 24" stroke="#EDE0CC" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  <!-- Crown padding -->
  <ellipse cx="26" cy="4.5" rx="5" ry="2.5" fill="#D4C6AF"/>
  <ellipse cx="26" cy="4" rx="3.5" ry="1.5" fill="#EDE0CC" opacity="0.6"/>

  <!-- Left arm -->
  <rect x="6.5" y="20" width="4" height="9" rx="1.5" fill="#C4B49C"/>
  <rect x="7.5" y="20" width="2" height="9" rx="1" fill="#D8CAAE" opacity="0.5"/>
  <!-- Right arm -->
  <rect x="41.5" y="20" width="4" height="9" rx="1.5" fill="#C4B49C"/>
  <rect x="42.5" y="20" width="2" height="9" rx="1" fill="#D8CAAE" opacity="0.5"/>

  <!-- Left ear cup -->
  <ellipse cx="8" cy="27" rx="6.5" ry="8.5" fill="url(#cupOuter)"/>
  <ellipse cx="8" cy="27" rx="5" ry="7" fill="#A89278" opacity="0.6"/>
  <ellipse cx="8" cy="27" rx="4.5" ry="6.5" fill="#C0AD96"/>
  <ellipse cx="8" cy="27" rx="2.5" ry="3.5" fill="#9A8470"/>
  <circle cx="8" cy="27" r="1.2" fill="#7A6858"/>
  <ellipse cx="6" cy="23.5" rx="1.2" ry="1.8" fill="white" opacity="0.35"/>

  <!-- Right ear cup -->
  <ellipse cx="44" cy="27" rx="6.5" ry="8.5" fill="url(#cupOuter)"/>
  <ellipse cx="44" cy="27" rx="5" ry="7" fill="#A89278" opacity="0.6"/>
  <ellipse cx="44" cy="27" rx="4.5" ry="6.5" fill="#C0AD96"/>
  <ellipse cx="44" cy="27" rx="2.5" ry="3.5" fill="#9A8470"/>
  <circle cx="44" cy="27" r="1.2" fill="#7A6858"/>
  <ellipse cx="42" cy="23.5" rx="1.2" ry="1.8" fill="white" opacity="0.35"/>

  <!-- Body -->
  <ellipse cx="26" cy="33" rx="17" ry="18" fill="url(#bodyGrad)"/>

  <!-- Eyes (happy) -->
  <path d="M18 24 Q20 20 22 24 M30 24 Q32 20 34 24" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Cheeks -->
  <ellipse cx="17" cy="31" rx="4" ry="2.5" fill="#EC4899" opacity="0.4"/>
  <ellipse cx="35" cy="31" rx="4" ry="2.5" fill="#EC4899" opacity="0.4"/>

  <!-- Mouth (happy) -->
  <path d="M20 31 Q26 37 32 31" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
